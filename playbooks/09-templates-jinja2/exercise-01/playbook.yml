---
# Exercise 1: Variable Substitution & Filters
# Goal: Create a config file with variables and filters

- name: Exercise 1 — Template with variables and filters
  hosts: localhost
  gather_facts: no
  vars:
    app_name: "MyApp"
    app_version: "1.0.0"
    listen_port: 8080
    max_conn: 512
    missing_var: ""
  tasks:
    - name: Create output directory
      ansible.builtin.file:
        path: /tmp/template-ex-01
        state: directory
        mode: '0755'

    - name: Deploy config template
      ansible.builtin.template:
        src: templates/config.conf.j2
        dest: /tmp/template-ex-01/config.conf
        mode: '0644'

    - name: Show rendered file
      ansible.builtin.command: "cat /tmp/template-ex-01/config.conf"
      register: output
      changed_when: false

    - name: Display output
      ansible.builtin.debug:
        var: output.stdout_lines
