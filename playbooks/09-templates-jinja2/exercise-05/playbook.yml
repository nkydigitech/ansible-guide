---
# Exercise 5: Nested Loop (Reverse Proxy Config)
# Goal: Generate HAProxy-style backend config from nested data

- name: Exercise 5 — Nested loops
  hosts: localhost
  gather_facts: no
  vars:
    applications:
      - name: api
        port: 8080
        backends:
          - host: 10.0.1.10
            port: 9000
          - host: 10.0.1.11
            port: 9000
      - name: web
        port: 80
        backends:
          - host: 10.0.2.10
            port: 3000
          - host: 10.0.2.11
            port: 3000
          - host: 10.0.2.12
            port: 3000
  tasks:
    - name: Create output directory
      ansible.builtin.file:
        path: /tmp/template-ex-05
        state: directory
        mode: '0755'

    - name: Deploy HAProxy-style config
      ansible.builtin.template:
        src: templates/haproxy.conf.j2
        dest: /tmp/template-ex-05/haproxy.conf
        mode: '0644'

    - name: Show rendered file
      ansible.builtin.command: "cat /tmp/template-ex-05/haproxy.conf"
      register: output
      changed_when: false

    - name: Display output
      ansible.builtin.debug:
        var: output.stdout_lines
