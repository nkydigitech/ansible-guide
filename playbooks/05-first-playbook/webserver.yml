---
# Module 05 (real server): install and start Nginx on a remote host (e.g. EC2).
# Requires sudo on the target. DO NOT run this against your Codespace localhost.
#
# Run it against EC2 (see README for inventory setup):
#   ansible-playbook -i ../../inventory/ec2.ini webserver.yml --check --diff   # preview
#   ansible-playbook -i ../../inventory/ec2.ini webserver.yml                  # apply

- name: Install and start Nginx (real server)
  hosts: webservers
  become: yes
  gather_facts: yes

  vars:
    nginx_port: 80

  tasks:
    - name: Update apt cache (Debian/Ubuntu)
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600
      when: ansible_facts['os_family'] == "Debian"

    - name: Install Nginx
      ansible.builtin.apt:
        name: nginx
        state: present
      when: ansible_facts['os_family'] == "Debian"
      notify: Restart nginx

    - name: Deploy a custom landing page
      ansible.builtin.copy:
        content: "<h1>Deployed by Ansible - {{ inventory_hostname }}</h1>\n"
        dest: /var/www/html/index.nginx-debian.html
        mode: '0644'
      notify: Restart nginx

    - name: Ensure Nginx is running and enabled at boot
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: yes

    - name: Verify Nginx answers on port {{ nginx_port }}
      ansible.builtin.uri:
        url: "http://localhost:{{ nginx_port }}"
        status_code: 200

  handlers:
    - name: Restart nginx
      ansible.builtin.service:
        name: nginx
        state: restarted
