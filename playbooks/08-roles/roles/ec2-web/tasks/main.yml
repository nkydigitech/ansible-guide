---
- name: Install nginx
  ansible.builtin.package:
    name: "{{ nginx_package }}"
    state: present
  notify: Restart nginx

- name: Deploy landing page template
  ansible.builtin.template:
    src: index.html.j2
    dest: /var/www/html/index.html
    mode: '0644'
  notify: Restart nginx

- name: Ensure nginx is running
  ansible.builtin.service:
    name: "{{ nginx_service }}"
    state: started
    enabled: yes
